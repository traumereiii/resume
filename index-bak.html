<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서동성 · 백엔드 개발 · 인프라 운영</title>
<meta name="description" content="업무 시스템과 데이터 수집 플랫폼을 개발하며 CI/CD·모니터링 등 운영 환경까지 함께 다루는 백엔드 개발자 서동성의 프로필입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<!-- ?v= 값은 캐시 무효화용입니다. css/js를 고쳤는데 화면에 반영되지 않으면 숫자를 올리세요. -->
<link rel="stylesheet" href="./css/style.css?v=12">
<!-- 스크립트가 동작할 때만 등장 애니메이션의 초기 상태를 적용해 깜빡임을 막습니다. -->
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<!-- 상단 고정 바 -->
<div class="topbar" aria-hidden="true"></div>

<header class="section header">
  <!-- 왼쪽: 프로필 사진 + 기본 정보 -->
  <div class="header__aside" data-reveal>
    <div class="photo">
      <div class="photo__shadow" aria-hidden="true"></div>
      <div class="photo__frame">
        <img class="photo__img" src="./images/profile.jpg" alt="서동성 프로필 사진" width="800" height="1067">
      </div>
    </div>

    <div class="contact">
      <div class="contact__label">Contact</div>
      <a class="contact__link contact__link--strong" href="mailto:sds901234@naver.com">sds901234@naver.com</a>
      <a class="contact__link" href="https://github.com/traumereiii" target="_blank" rel="noopener">github.com/traumereiii</a>
    </div>
  </div>

  <!-- 오른쪽: 이름 + 소개 문단 -->
  <div class="header__main" data-reveal>
    <svg class="squiggle" width="150" height="34" viewBox="0 0 150 34" fill="none" aria-hidden="true">
      <path d="M2 26c14-18 22 6 34-8s18 12 32-2 20 10 34-4 22 8 36-6" stroke="#1B2ED6" stroke-width="3" stroke-linecap="round" />
    </svg>
    <h1 class="name">서동성<span class="name__role">백엔드 개발 · 인프라 운영</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="lede">서비스를 안정적으로 운영하고 지속적으로 개선하는 데 가치를 두고 개발합니다. 업무 시스템과 데이터 수집 플랫폼을 개발하며 백엔드 서비스뿐 아니라 CI/CD, 모니터링, 세션 관리 등 운영 환경까지 함께 구축하고 개선해 왔습니다.</p>
  </div>
</header>

<!-- 경력 — 각 경력 아래에 해당 회사에서 진행한 프로젝트가 함께 표시됩니다. -->
<section id="experience" class="experience">
  <div class="section grid" data-reveal>
    <h2 class="eyebrow eyebrow--invert">경력</h2>
    <div class="jobs" data-list="jobs"></div>
  </div>
</section>

<!-- 기술 스택 -->
<section id="skills" class="section section--last" data-reveal>
  <div class="grid">
    <div class="skills__aside">
      <h2 class="eyebrow">기술 스택</h2>
      <div class="chips" data-list="categories"></div>
      <p class="note">이력서에 기재한 기술과 실무에서 사용한 기술입니다.</p>
    </div>
    <div class="skills" data-list="skills"></div>
  </div>
</section>

<footer class="footer">
  <span>© 2026 서동성</span>
  <a href="mailto:sds901234@naver.com">sds901234@naver.com</a>
</footer>

<script src="./js/data.js?v=12"></script>
<script src="./js/app.js?v=12"></script>
</body>
</html>
